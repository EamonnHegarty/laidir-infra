version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /global
      - /envs/*
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
