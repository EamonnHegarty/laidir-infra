name: pr

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.14.7
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: eu-west-1

jobs:
  checks:
    name: fmt · validate · tflint · checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          shopt -s nullglob
          for dir in bootstrap global envs/*/; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: checkov
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: .
          config_file: .checkov.yaml

  plan:
    name: plan (${{ matrix.env }})
    needs: checks
    # Forks get no OIDC token and must never assume AWS roles.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::670518205160:role/laidir-gha-infra-plan
          role-session-name: laidir-plan-pr${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -input=false -lock-timeout=120s -out=tfplan 2>&1 | tee plan.log
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Render plan
        if: always()
        run: |
          [[ -f plan.txt ]] || cp plan.log plan.txt 2>/dev/null || touch plan.txt
          touch plan.json
          bash "${GITHUB_WORKSPACE}/.github/scripts/render-plan.sh" \
            "${{ matrix.env }}" "${{ steps.plan.outcome }}" plan.json plan.txt plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

      # Uses the preinstalled gh CLI rather than a third-party action: one less dependency
      # with access to the token. Always posts something, even if earlier steps failed.
      - name: Post or update PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: "<!-- laidir-plan:${{ matrix.env }} -->"
          ENV_NAME: ${{ matrix.env }}
        run: |
          if [[ ! -s plan.md ]]; then
            printf '%s\n## Terraform plan: `%s`\n\n❌ The plan produced no output. See the job log.\n' "$MARKER" "$ENV_NAME" > plan.md
          fi
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.type == \"Bot\" and (.body | startswith(\"${MARKER}\"))) | .id" | head -n1)
          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@plan.md > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@plan.md > /dev/null
          fi

      - name: Fail if plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1
