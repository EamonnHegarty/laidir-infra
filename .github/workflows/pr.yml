name: pr

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.14.7
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: eu-west-1

jobs:
  checks:
    name: fmt · validate · tflint · checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          shopt -s nullglob
          for dir in bootstrap global envs/*/; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml

  plan:
    name: plan (${{ matrix.env }})
    needs: checks
    # Forks get no OIDC token and must never assume AWS roles.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: laidir-plan-pr${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -input=false -lock-timeout=120s -out=tfplan 2>&1 | tee plan.log
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Render plan
        if: always()
        run: |
          [[ -f plan.txt ]] || cp plan.log plan.txt 2>/dev/null || touch plan.txt
          touch plan.json
          bash "${GITHUB_WORKSPACE}/.github/scripts/render-plan.sh" \
            "${{ matrix.env }}" "${{ steps.plan.outcome }}" plan.json plan.txt plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_FILE: envs/${{ matrix.env }}/plan.md
          MARKER: "<!-- laidir-plan:${{ matrix.env }} -->"
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(process.env.MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1
