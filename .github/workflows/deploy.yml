name: deploy

on:
  push:
    branches: [main]
    # Only infra changes trigger a deploy run. Docs, lint config and the PR workflow don't.
    # deploy.yml itself is included so a change to the deploy logic is exercised straight away.
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/render-plan.sh"
  workflow_dispatch:

permissions: {}

# Never run two applies against the same state at once; never cancel one mid-apply.
concurrency:
  group: terraform-apply-prod
  cancel-in-progress: false

env:
  TF_VERSION: 1.14.7
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  AWS_REGION: eu-west-1

jobs:
  apply:
    name: apply (prod)
    runs-on: ubuntu-latest
    # The apply role only trusts `environment:prod`, so this line is what unlocks AWS.
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: envs/prod
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::670518205160:role/laidir-gha-infra-apply
          role-session-name: laidir-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      # Re-plan against current state rather than trusting the PR's plan, which may be stale.
      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=120s -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [[ $code -eq 1 ]]; then exit 1; fi
          echo "has_changes=$([[ $code -eq 2 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Plan summary
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/render-plan.sh" prod success plan.json plan.txt plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

      # Merges that only touch CI or docs still run the plan (proving prod matches main),
      # but there is nothing to apply.
      - name: terraform apply
        if: steps.plan.outputs.has_changes == 'true'
        run: terraform apply -input=false -lock-timeout=120s tfplan

      - name: Skip apply (no changes)
        if: steps.plan.outputs.has_changes != 'true'
        run: echo "✅ No infrastructure changes, apply skipped." >> "$GITHUB_STEP_SUMMARY"
